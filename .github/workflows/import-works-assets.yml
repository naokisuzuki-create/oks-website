          ]

          def variants(name):
              out = [name]
              clean = re.sub(r" \(\d+\)(?=\.[^.]+$)", "", name)
              if clean not in out:
                  out.append(clean)
              stem, dot, ext = clean.rpartition(".")
              if dot:
                  for e in ("jpg","JPG","jpeg","JPEG"):
                      candidate = stem + "." + e
                      if candidate not in out:
                          out.append(candidate)
              return out

          ctx = ssl.create_default_context()
          prefixes = ("", "case/takakura/", "case/塗装インスタから/")
          failures = []

          for target, original, expected in FILES:
              Path(target).parent.mkdir(parents=True, exist_ok=True)
              found = False
              for filename in variants(original):
                  for prefix in prefixes:
                      url = BASE + quote(prefix + filename, safe="/")
                      try:
                          req = Request(url, headers={"User-Agent":"Mozilla/5.0"})
                          with urlopen(req, timeout=20, context=ctx) as r:
                              data = r.read()
                          if hashlib.md5(data).hexdigest() != expected:
                              continue
                          Path(target).write_bytes(data)
                          print("OK", target, "<-", url)
                          found = True
                          break
                      except Exception:
                          pass
                  if found:
                      break
              if not found:
                  failures.append((target, original, expected))

          if failures:
              for x in failures:
                  print("FAILED", x)
              raise SystemExit(f"{len(failures)} image(s) could not be imported")

          shutil.copy2("assets/works/demolition-amagasaki/image-06.jpg","assets/works/demolition-amagasaki/cover.jpg")
          shutil.copy2("assets/works/stair-reform-katano/process-04.jpg","assets/works/stair-reform-katano/cover.jpg")
          shutil.copy2("assets/works/yawata-newbuild/image-28.jpg","assets/works/yawata-newbuild/cover.jpg")
          PY

      - name: Commit assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/works
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Import works images into local assets"
          git push
