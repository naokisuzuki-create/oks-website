name: Assemble Kyoto F cover

on:
  push:

permissions:
  contents: write

jobs:
  assemble:
    if: github.event.head_commit.message == 'Stage Kyoto F cover chunks'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and verify cover
        run: |
          cat .tmp/kyoto-cover/part00 .tmp/kyoto-cover/part01 .tmp/kyoto-cover/p020 .tmp/kyoto-cover/p021 .tmp/kyoto-cover/part03 .tmp/kyoto-cover/part04 .tmp/kyoto-cover/part05 > assets/works/kyoto-f-house/cover-main.webp
          test "$(stat -c%s assets/works/kyoto-f-house/cover-main.webp)" -eq 33758
          echo "3374d044f94bc7ece675cba1813cdf7233f43ba1b1bc21403f84759748526d06  assets/works/kyoto-f-house/cover-main.webp" | sha256sum -c -

      - name: Commit assembled cover and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/works/kyoto-f-house/cover-main.webp
          git rm -r .tmp/kyoto-cover
          git rm .github/workflows/assemble-kyoto-cover.yml
          git rm -f assets/works/kyoto-f-house/cover-hq-test.jpg || true
          git commit -m "Add high-quality Kyoto F cover"
          git push
